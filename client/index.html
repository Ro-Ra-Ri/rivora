<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rivora — Quiz Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      .font-display {
        font-family: "Fredoka", cursive, sans-serif;
      }
      .font-sans {
        font-family: "Nunito", sans-serif;
      }

      /* ======================================================== */
      /* ANIMASI TACTILE & PLAYFUL KHAS PLOP                      */
      /* ======================================================== */
      @keyframes floatSlow {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      @keyframes floatReverse {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(7px) rotate(-2deg);
        }
      }

      @keyframes mascotPeekIdle {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-9px);
        }
      }

      @keyframes popInBouncy {
        0% {
          opacity: 0;
          transform: scale(0.88) translateY(14px);
        }
        70% {
          opacity: 1;
          transform: scale(1.03) translateY(-3px);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes heartbeatUrgent {
        0%, 100% {
          transform: scale(1);
        }
        18% {
          transform: scale(1.14);
        }
        32% {
          transform: scale(0.96);
        }
        46% {
          transform: scale(1.08);
        }
      }

      @keyframes shimmerSweep {
        0% {
          transform: translateX(-150%) skewX(-20deg);
        }
        100% {
          transform: translateX(250%) skewX(-20deg);
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          box-shadow: 0 4px 0 #0E1236, 0 0 0 rgba(197, 242, 58, 0);
        }
        50% {
          box-shadow: 0 4px 0 #0E1236, 0 0 20px rgba(197, 242, 58, 0.45);
        }
      }

      .animate-float-slow {
        animation: floatSlow 4s ease-in-out infinite;
      }

      .animate-float-reverse {
        animation: floatReverse 4.6s ease-in-out infinite;
      }

      .animate-mascot-peek {
        animation: mascotPeekIdle 3.8s ease-in-out infinite;
      }

      .animate-pop-in {
        animation: popInBouncy 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .animate-heartbeat {
        animation: heartbeatUrgent 1s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
